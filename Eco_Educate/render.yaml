services:
  - type: web
    name: ecoguide-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend app:app
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
